spring:
  application:
    name: transaction-coordinator-ledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/ledger_db}
    username: ${DB_USERNAME:ledger_user}
    password: ${DB_PASSWORD:ledger_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ledger_user}
    password: ${RABBITMQ_PASSWORD:ledger_password}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
  rate-limit:
    requests: ${RATE_LIMIT_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:PT1M}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
  auth:
    bootstrap-admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}