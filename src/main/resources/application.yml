spring:
  application:
    name: transaction-coordinator-ledger

  datasource:
    url: jdbc:postgresql://localhost:5437/ledger_db
    username: ledger_user
    password: ledger_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: ledger_user
    password: ledger_password

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info